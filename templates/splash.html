{% extends "base.html" %}

{% block title %}
SmartRecruitment | Find • Assess • Hire
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth_common.css') }}">
<style>
    .splash-full-wrapper {
        min-height: 92vh;
        width: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 3rem 4rem;
        background: url("{{ url_for('static', filename='images/clean_laptop_left_bg.gif') }}") no-repeat center center / cover;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(59, 130, 246, 0.15);
    }

    @keyframes splashBgZoom {
        0% { transform: scale(1); }
        100% { transform: scale(1.05); }
    }

    .splash-full-wrapper::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(240, 247, 255, 0.35) 0%, rgba(224, 242, 254, 0.35) 50%, rgba(248, 250, 252, 0.35) 100%);
        pointer-events: none;
        animation: splashBgZoom 6s ease-in-out infinite alternate;
    }

    /* BOTTOM LEFT LOADING PROGRESS TRACK */
    .splash-bottom-bar {
        max-width: 400px;
        z-index: 10;
        position: relative;
        padding: 1.25rem 1.5rem;
        background: rgba(255, 255, 255, 0.48);
        backdrop-filter: blur(28px) saturate(220%);
        -webkit-backdrop-filter: blur(28px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 20px;
        box-shadow: 0 15px 35px -5px rgba(59, 130, 246, 0.2);
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards, splashFloat 6s ease-in-out infinite alternate 0.8s;
    }

    @keyframes splashFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    .splash-progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.88rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 8px;
        letter-spacing: -0.2px;
    }

    .splash-progress-track {
        height: 6px;
        background: rgba(226, 238, 253, 0.9);
        border-radius: 10px;
        overflow: hidden;
        width: 100%;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .splash-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        animation: splashFill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes splashFill {
        0% { width: 0%; }
        70% { width: 75%; }
        100% { width: 100%; }
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="splash-full-wrapper">
    <!-- 3D FLOATING ANIMATED OVERLAY ELEMENTS -->
    <div class="bg-3d-floating-layer">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-arch-ring-1"></div>
        <div class="bg-arch-ring-2"></div>
        <div class="bg-sphere-3d bg-sphere-3d-1"></div>
        <div class="bg-sphere-3d bg-sphere-3d-2"></div>
        <div class="bg-sphere-3d bg-sphere-3d-3"></div>
        <div class="float-3d-avatar-1"></div>
        <div class="float-3d-avatar-2"></div>
    </div>

    <!-- BOTTOM LEFT PROGRESS TRACK MATCHING REFERENCE IMAGE -->
    <div class="splash-bottom-bar">
        <div class="splash-progress-meta">
            <span>Loading your experience...</span>
            <span>75%</span>
        </div>
        <div class="splash-progress-track">
            <div class="splash-progress-fill"></div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/hero_3d_engine.js') }}"></script>
<script>
    // Smooth transition to login after progress fill completes
    setTimeout(function() {
        if (window.location.pathname === "/" || window.location.pathname === "/splash") {
            window.location.href = "{{ url_for('login') }}";
        }
    }, 2800);
</script>
{% endblock %}
